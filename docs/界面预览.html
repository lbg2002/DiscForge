<section class="view" id="sessions" hidden><div class="pagehead"><h1>光盘区段</h1><button class="secondary small" id="read-sessions">刷新</button></div><div class="panel"><table class="sessiontable"><colgroup><col style="width:17%"><col style="width:24%"><col style="width:29%"><col style="width:30%"></colgroup><thead><tr><th>区段</th><th>写入方式</th><th>数据大小</th><th>状态</th></tr></thead><tbody id="sessions-list"></tbody></table></div></section>
<section class="view" id="history" hidden><div class="pagehead"><h1>任务记录</h1></div><div class="panel"><table class="sessiontable"><colgroup><col style="width:30%"><col style="width:20%"><col style="width:25%"><col style="width:25%"></colgroup><thead><tr><th>时间</th><th>方式</th><th>数据大小</th><th>状态</th></tr></thead><tbody id="history-list"></tbody></table></div></section>
<section class="view" id="settings" hidden><div class="pagehead"><h1>设置</h1></div><div class="panel"><div class="settingscontent"><div class="settingrow"><label for="units">显示单位</label><select id="units"><option value="auto">自动</option><option>KB</option><option>MB</option><option>GB</option></select></div><div class="settingrow"><label for="theme">强调色</label><select id="theme"><option value="blue">冰蓝</option><option value="cyan">青绿</option><option value="amber">琥珀</option></select></div><div class="settingrow"><label for="density">界面密度</label><select id="density"><option value="default">标准</option><option value="compact">紧凑</option></select></div><div class="settingrow"><label for="default-verify">默认写后校验</label><input id="default-verify" type="checkbox" checked></div><div class="settingrow"><label for="default-eject">默认完成后弹出</label><input id="default-eject" type="checkbox" checked></div></div></div></section>
</main></div><footer class="statusbar"><span id="status">光驱一 · 已就绪</span><span class="hide-mobile" id="status-disc">可追加光盘</span><button id="show-output">刻录日志</button></footer></div>
<div class="modalback" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">确认刻录</h2><p id="modal-summary"></p><div class="progress" id="progress" hidden><i id="progressbar"></i></div><p id="stage" aria-live="polite"></p><div class="modalactions"><button id="cancel">取消</button><button class="primary" id="confirm">开始演示</button></div></div></div><div class="toast" id="toast" role="status" hidden></div><input id="picker" type="file" multiple hidden><input id="folder-picker" type="file" webkitdirectory multiple hidden>
<script>
'use strict';const $=id=>document.getElementById(id);const devices={cd:{name:'光驱一',type:'可追加光盘',cap:700,used:204,session:2},dvd:{name:'光驱二',type:'高密度可追加光盘',cap:4482,used:1024,session:2},empty:{name:'光驱三',type:'未插入光盘',cap:0,used:0,session:0}};let device='cd',finalize=false,running=false,focusBefore=null,timer;let files=[{name:'实验数据',size:182*1048576},{name:'项目技术报告',size:24.8*1048576},{name:'仿真结果',size:48.6*1048576}];const total=()=>files.reduce((s,f)=>s+f.size,0)/1048576;let displayUnit='auto';try{displayUnit=localStorage.getItem('discforge-display-unit')||'auto'}catch{}if(!['auto','KB','MB','GB'].includes(displayUnit))displayUnit='auto';$('units').value=displayUnit;const fmt=n=>{const u=displayUnit==='auto'?(n>=1073741824?'GB':n>=1048576?'MB':'KB'):displayUnit;return(n/({KB:1024,MB:1048576,GB:1073741824}[u])).toFixed(u==='KB'?1:2)+' '+u};const fmtMB=n=>fmt(n*1048576);$('units').onchange=e=>{displayUnit=e.target.value;try{localStorage.setItem('discforge-display-unit',displayUnit)}catch{}render()};function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2800)}function page(id){document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==id);document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===id);b.setAttribute('aria-current',b.dataset.page===id?'page':'false')})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));function row(values){const tr=document.createElement('tr');values.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===values.length-1)td.className='state';tr.append(td)});return tr}function renderSessions(){const d=devices[device];$('sessions-list').replaceChildren();if(d.cap){const first=device==='cd'?128:768,second=d.used-first;$('sessions-list').append(row(['一','初次写入',fmtMB(first),'已关闭']),row(['二','追加写入',fmtMB(second),'已关闭']))}}
function render(){const d=devices[device],t=total(),free=d.cap-d.used-t;$('files').replaceChildren();files.forEach((f,i)=>{const tr=document.createElement('tr'),td=document.createElement('td'),wrap=document.createElement('div'),name=document.createElement('span'),sz=document.createElement('td'),act=document.createElement('td'),btn=document.createElement('button');wrap.className='filename';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('icon');svg.setAttribute('aria-hidden','true');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#file');svg.append(use);name.textContent=f.name;name.title=f.name;wrap.append(svg,name);td.append(wrap);sz.className='filesize';sz.textContent=fmt(f.size);btn.className='remove';btn.textContent='×';btn.setAttribute('aria-label','移除'+f.name);btn.onclick=()=>{files.splice(i,1);render()};act.append(btn);tr.append(td,sz,act);$('files').append(tr)});$('emptyfiles').hidden=!!files.length;$('file-count').textContent=files.length;$('file-summary').textContent='共 '+files.length+' 项';$('planned').textContent='合计 '+fmtMB(t);$('media').textContent=d.type;$('disc-state').textContent=d.cap?'● 可继续写入':'无介质';$('capacity').innerHTML=fmtMB(d.cap);$('sessions-count').textContent='已有 '+d.session+' 个区段';$('free').textContent='写入后可用 '+fmtMB(Math.max(0,free));$('oldlegend').textContent='已有 '+fmtMB(d.used);$('newlegend').textContent='待写入 '+fmtMB(t);$('oldbar').style.width=(d.cap?d.used/d.cap*100:0)+'%';$('newbar').style.width=(d.cap?Math.min(t/d.cap*100,100):0)+'%';$('start').disabled=!d.cap||!files.length||free<0;$('ready').textContent=!d.cap?'未插入光盘':!files.length?'未选择文件':free<0?'容量不足':'● 准备就绪';$('next-session').textContent=d.cap?(finalize?'写入后封盘':'第三个区段'):'';$('status').textContent=d.name+' · '+(!d.cap?'无介质':'已就绪');$('status-disc').textContent=d.type;for(const [id,on]of[['append',!finalize],['finalize',finalize]]){$(id).classList.toggle('selected',on);$(id).setAttribute('aria-pressed',String(on))}renderSessions();renderCharts()}function log(s){const line=document.createElement('div');line.textContent=s;$('console').append(line)}$('drive').onchange=e=>{device=e.target.value;render();log('已读取'+devices[device].name+'：'+devices[device].type)};$('refresh').onclick=()=>{render();log('光盘状态已刷新');toast('已刷新')};$('read-sessions').onclick=()=>{renderSessions();toast('已刷新')};$('append').onclick=()=>{finalize=false;render()};$('finalize').onclick=()=>{finalize=true;render()};$('clear').onclick=()=>{files=[];render()};function add(list){for(const f of list)files.push({name:f.webkitRelativePath||f.name,size:f.size});render()}$('add-files').onclick=()=>$('picker').click();$('add-folder').onclick=()=>$('folder-picker').click();for(const id of ['picker','folder-picker'])$(id).onchange=e=>{add(e.target.files);e.target.value=''};$('filewrap').ondragover=e=>{e.preventDefault();$('filewrap').classList.add('dragover')};$('filewrap').ondragleave=()=>$('filewrap').classList.remove('dragover');$('filewrap').ondrop=e=>{e.preventDefault();$('filewrap').classList.remove('dragover');add(e.dataTransfer.files)};$('show-output').onclick=()=>{page('burn');$('output').hidden=!$('output').hidden};$('hide-output').onclick=()=>$('output').hidden=true;$('theme').onchange=e=>document.documentElement.style.setProperty('--blue',{blue:'#72bdff',cyan:'#78d5c7',amber:'#eebc7e'}[e.target.value]);$('density').onchange=e=>document.body.classList.toggle('compact',e.target.value==='compact');$('default-verify').onchange=e=>$('verify').checked=e.target.checked;$('default-eject').onchange=e=>$('eject').checked=e.target.checked;function close(){if(running)return;$('modal').hidden=true;focusBefore?.focus()}$('cancel').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('start').onclick=()=>{if($('start').disabled)return;if(!$('disc-label').value.trim()){toast('请输入光盘名称');$('disc-label').focus();return}focusBefore=document.activeElement;$('modal-title').textContent='确认刻录';$('modal-summary').textContent=$('disc-label').value+'\n'+devices[device].name+' · '+fmtMB(total())+' · '+(finalize?'封盘':'追加')+'\n本次为界面演示，不写入光盘。';$('stage').textContent='';$('progress').hidden=true;$('confirm').hidden=false;$('cancel').textContent='取消';$('modal').hidden=false;$('confirm').focus()};$('confirm').onclick=async()=>{running=true;$('confirm').hidden=true;$('cancel').disabled=true;$('progress').hidden=false;$('progressbar').style.width='0%';const steps=['读取区段','生成映像','写入数据',finalize?'关闭并封盘':'关闭区段'];if($('verify').checked)steps.push('校验文件');if($('eject').checked)steps.push('弹出光盘');for(let i=0;i<steps.length;i++){$('stage').textContent=steps[i]+'（模拟）';$('progressbar').style.width=(i+1)/steps.length*100+'%';log(steps[i]+'（模拟）');await new Promise(r=>setTimeout(r,500))}running=false;$('modal-title').textContent='演示完成';$('stage').textContent='';$('cancel').disabled=false;$('cancel').textContent='完成';$('cancel').focus();$('history-list').prepend(row([new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),finalize?'封盘':'追加',fmtMB(total()),'模拟完成']))};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&!$('modal').hidden){const list=[...$('modal').querySelectorAll('button')].filter(b=>!b.disabled&&!b.hidden);if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}});
function svgNode(name,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [key,value] of Object.entries(attrs))e.setAttribute(key,String(value));if(text!==undefined)e.textContent=text;return e}
function renderCharts(){const d=devices[device],t=total(),cap=d.cap,used=cap?d.used/cap:0,planned=cap?Math.min(Math.max(0,1-used),t/cap):0,circ=2*Math.PI*35,pct=cap?(d.used+t)/cap*100:0;const percentText=cap?pct.toFixed(0)+'%':'—';$('gauge-percent').textContent=percentText;$('gauge-percent').style.color=pct>100?'#f1a385':'';$('ring-used').setAttribute('stroke-dasharray',(used*circ)+' '+circ);$('ring-planned').setAttribute('stroke-dasharray',(planned*circ)+' '+circ);$('ring-planned').setAttribute('stroke-dashoffset',-used*circ);$('capacity-gauge').setAttribute('aria-label',cap?'写入后容量占用百分之'+pct.toFixed(1):'未插入光盘');const svg=$('capacity-plot'),layer=$('plot-layer'),width=Math.max(150,svg.getBoundingClientRect().width||500),left=3,right=width-3,plotWidth=right-left;svg.setAttribute('viewBox','0 0 '+width+' 57');layer.replaceChildren();const first=cap?(device==='cd'?128:768)/cap:0,second=used-first;const segments=[{v:first,c:'seg-a'},{v:second,c:'seg-b'},{v:planned,c:'seg-c'},{v:Math.max(0,1-used-planned),c:'seg-free'}];let x=left;segments.forEach(seg=>{const w=seg.v*plotWidth;if(w>0)layer.append(svgNode('rect',{x,y:10,width:w,height:14,class:seg.c}));x+=w});layer.append(svgNode('rect',{x:left,y:10,width:plotWidth,height:14,class:'outline'}));for(let i=0;i<=4;i++){const pos=left+plotWidth*i/4;layer.append(svgNode('line',{x1:pos,x2:pos,y1:4,y2:29,class:'gridline'}));layer.append(svgNode('line',{x1:pos,x2:pos,y1:30,y2:34,class:'tick'}));layer.append(svgNode('text',{x:pos,y:48,'text-anchor':i===0?'start':i===4?'end':'middle'},i*25+'%'))}let boundary=left;segments.slice(0,3).forEach(seg=>{boundary+=seg.v*plotWidth;if(seg.v>0&&boundary<right)layer.append(svgNode('line',{x1:boundary,x2:boundary,y1:10,y2:24,class:'segment-line'}))});layer.append(svgNode('line',{x1:left,x2:right,y1:31,y2:31,class:'axis'}));svg.setAttribute('aria-label',cap?'容量分配：第一区段'+(device==='cd'?128:768)+'兆字节，已有数据合计'+d.used+'兆字节，待写入'+t.toFixed(1)+'兆字节，剩余'+Math.max(0,cap-d.used-t).toFixed(1)+'兆字节':'未插入光盘')}
if(typeof ResizeObserver!=='undefined'){new ResizeObserver(()=>renderCharts()).observe($('capacity-plot'))}
$('history-list').append(row(['上次','追加',fmtMB(76),'已完成']));render();log('光驱一已就绪');
</script></body></html>
